# Keeps the app awake during working hours. Render's free plan puts the server to sleep after 15 minutes without
# visitors; the next person then waits 30–60 seconds for it to start ("the app is slow in the morning").
# Every 10 minutes from 07:00 to 22:30 IST this opens the site once (well inside the free plan's 750 hours a month).
# Not needed (delete this file) once the service is on a paid Render plan, which never sleeps.
name: Keep the app awake
on:
  schedule:
    - cron: '*/10 1-16 * * *'   # 06:30–22:30 IST
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Open the site
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' https://mihir-task-manager.onrender.com/ || true)
            echo "HTTP $code"; [ "$code" = "200" ] && exit 0; sleep 10
          done
          exit 0
